name: Nightly Data Pipeline

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          Database_connection_key: ${{ secrets.Database_connection_key }}
        run: python main.py

      - name: Upload logs
        if: always()   # uploads logs even if pipeline fails
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
